<!doctype html>
<html lang="ja" data-theme="night">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FE Classroom Quiz</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem("glowadder-theme");
                document.documentElement.setAttribute(
                    "data-theme",
                    t === "classroom" ? "classroom" : "night"
                );
            } catch (e) { }
        })();
    </script>
    <style>
        :root,
        html[data-theme="night"] {
            color-scheme: dark;
            --bg: #0b1220;
            --bg-grad: #17264a;
            --page-bg: radial-gradient(1000px 600px at 20% 0%, var(--bg-grad), var(--bg));
            --text: #e8eefc;
            --muted: #b7c3e6;
            --line: rgba(255, 255, 255, 0.12);
            --card: rgba(16, 26, 48, 0.88);
            --accent: #8ab4ff;
            --ok: #7ee787;
            --ng: #ff6b81;
            --warn: #ffd166;
            --top: rgba(16, 26, 48, 0.92);
            --control: rgba(255, 255, 255, 0.06);
            --control-hover: rgba(138, 180, 255, 0.45);
            --inset: rgba(0, 0, 0, 0.18);
            --code-bg: rgba(0, 0, 0, 0.22);
            --pill-bg: rgba(138, 180, 255, 0.16);
            --pill-line: rgba(138, 180, 255, 0.28);
            --tag-bg: rgba(255, 255, 255, 0.04);
            --ok-line: rgba(126, 231, 135, 0.35);
            --ok-bg: rgba(126, 231, 135, 0.12);
            --ng-line: rgba(255, 107, 129, 0.35);
            --ng-bg: rgba(255, 107, 129, 0.12);
            --warn-line: rgba(255, 209, 102, 0.35);
            --warn-bg: rgba(255, 209, 102, 0.12);
            --warn-text: #ffd166;
            --lift: rgba(255, 255, 255, 0.04);
            --seg-split: rgba(255, 255, 255, 0.08);
            --seg-active: rgba(138, 180, 255, 0.16);
        }

        html[data-theme="classroom"] {
            color-scheme: light;
            --bg: #eef3fb;
            --bg-grad: #f7f9fd;
            --page-bg: linear-gradient(180deg, var(--bg-grad), var(--bg));
            --text: #1a2744;
            --muted: #5a6b8a;
            --line: #c9d6ee;
            --card: #ffffff;
            --accent: #3b6fd8;
            --ok: #1a9f5c;
            --ng: #e03d55;
            --warn: #b57a00;
            --top: rgba(255, 255, 255, .92);
            --control: #ffffff;
            --control-hover: rgba(122, 162, 255, .55);
            --inset: #f7f9fd;
            --code-bg: #f3f6fc;
            --pill-bg: rgba(122, 162, 255, .12);
            --pill-line: rgba(122, 162, 255, .25);
            --tag-bg: #eef3fb;
            --ok-line: rgba(33, 199, 122, .35);
            --ok-bg: rgba(33, 199, 122, .10);
            --ng-line: rgba(255, 90, 112, .35);
            --ng-bg: rgba(255, 90, 112, .10);
            --warn-line: rgba(255, 209, 102, .35);
            --warn-bg: rgba(255, 209, 102, .10);
            --warn-text: #7a5400;
            --lift: #f3f6fc;
            --seg-split: #c9d6ee;
            --seg-active: rgba(59, 111, 216, 0.12);
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif;
            background: var(--page-bg);
            color: var(--text);
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 18px;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 14px 16px;
            background: var(--top);
            border: 1px solid var(--line);
            border-radius: 14px;
            position: sticky;
            top: 10px;
            backdrop-filter: blur(8px);
        }

        .topEnd {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: .2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            display: none;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 999px;
            background: var(--warn-bg);
            border: 1px solid var(--warn-line);
            color: var(--warn);
        }

        .meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--muted);
        }

        .pill {
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--pill-bg);
            border: 1px solid var(--pill-line);
        }

        .seg {
            display: inline-flex;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            background: var(--lift);
            flex-shrink: 0;
        }

        .seg button {
            border: 0;
            border-radius: 0;
            background: transparent;
            color: var(--muted);
            padding: 7px 10px;
            cursor: pointer;
            font-size: 13px;
            border-right: 1px solid var(--seg-split);
        }

        .seg button:last-child {
            border-right: 0;
        }

        .seg button.active {
            color: var(--text);
            background: var(--seg-active);
        }

        .seg button:hover {
            border-color: var(--seg-split);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-top: 14px;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .row>* {
            flex: 0 0 auto;
        }

        #setupCountsDiff {
            display: contents;
        }

        .small {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }

        .k {
            color: var(--accent);
            font-weight: 600;
        }

        .hr {
            height: 1px;
            background: var(--line);
            margin: 12px 0;
            opacity: .7;
        }

        button,
        select,
        input,
        textarea {
            background: var(--control);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            accent-color: var(--accent);
        }

        button {
            cursor: pointer;
        }

        button:hover {
            border-color: var(--control-hover);
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Noto Sans JP", monospace;
            font-size: 12px;
        }

        .toggleBtn {
            padding: 10px 12px;
            border-radius: 10px;
        }

        .presetBtn {
            padding: 8px 10px;
            border-radius: 999px;
            font-size: 12px;
        }

        .checkgrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px 12px;
        }

        label {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 14px;
        }

        .choice {
            margin: 10px 0;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--inset);
        }

        #quiz {
            font-size: 16px;
            color: var(--text);
            line-height: 1.65;
        }

        #quiz h3 {
            font-size: 1.15em;
            font-weight: 700;
            margin: 0 0 12px;
        }

        .choice-mark {
            display: inline-block;
            min-width: 1.75em;
            font-weight: 700;
            color: var(--accent);
        }

        .choice:hover {
            border-color: var(--control-hover);
        }

        pre.code {
            background: var(--code-bg);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            overflow: auto;
        }

        pre.code code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Noto Sans JP", monospace;
            font-size: 12px;
            color: var(--text);
            white-space: pre;
        }

        .result-item {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            background: var(--inset);
        }

        .result-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .tag {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 999px;
            border: 1px solid var(--line);
            color: var(--muted);
            background: var(--tag-bg);
        }

        .tag.ok {
            color: var(--ok);
            border-color: var(--ok-line);
            background: var(--ok-bg);
        }

        .tag.ng {
            color: var(--ng);
            border-color: var(--ng-line);
            background: var(--ng-bg);
        }

        .jp {
            margin: 10px 0;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px dashed var(--line);
            background: var(--code-bg);
            color: var(--text);
        }

        .note {
            display: none;
            margin-top: 8px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--warn-line);
            background: var(--warn-bg);
            color: var(--warn-text);
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="top">
            <div class="title">
                基本情報 技術者試験 演習クイズ
                <span id="lockBadge" class="badge">生徒用モード</span>
            </div>
            <div class="topEnd">
                <div class="meta">
                    <span id="progress" class="pill">未開始</span>
                    <span id="timer" class="pill">-</span>
                    <span id="topics" class="pill">カテゴリ：-</span>
                    <span id="difficulty" class="pill">難易度：-</span>
                </div>
                <div class="seg" role="group" aria-label="プログラム言語">
                    <button id="btnCodeIpa" type="button" class="active">擬似言語</button>
                    <button id="btnCodeCsharp" type="button">C#</button>
                </div>
                <div class="seg" role="group" aria-label="配色">
                    <button id="btnThemeNight" type="button" class="active">夜間</button>
                    <button id="btnThemeClassroom" type="button">教室</button>
                </div>
            </div>
        </div>

        <div id="lockNote" class="note">
            生徒用モードです。出題条件は変更できません。タブは1つだけで利用してください。
        </div>

        <div class="grid">

            <!-- プリセット -->
            <div class="panel" id="presetPanel">
                <div class="row" id="presetBar">
                    <button class="presetBtn" data-preset="beginner">初級</button>
                    <button class="presetBtn" data-preset="standard">標準</button>
                    <button class="presetBtn" data-preset="advanced">応用</button>
                    <button class="presetBtn" data-preset="conditionsOnly">条件式のみ</button>
                    <button class="presetBtn" data-preset="arraysOnly">配列のみ</button>
                    <button class="presetBtn" data-preset="subprogramsOnly">副プログラムのみ</button>
                    <button class="presetBtn" data-preset="mixBasics">基礎ミックス</button>
                    <span class="small">固定プリセット</span>
                </div>

                <div class="hr"></div>

                <!-- 先生用UI（teacher=1 のときだけ表示） -->
                <div id="teacherPresetSection" style="display:none;">
                    <div class="row">
                        <div class="small"><b class="k">保存プリセット</b>（先生用）</div>
                    </div>
                    <div class="row" style="margin-top:8px;">
                        <div id="userPresetButtons" class="row small">（まだありません）</div>
                    </div>

                    <div id="presetManageSection">
                        <div class="hr"></div>
                        <div class="row">
                            <input id="presetNameInput" type="text" placeholder="保存プリセット名（例：第3回_条件式）"
                                style="min-width:260px;" />
                            <button id="savePresetBtn">保存</button>
                            <select id="deletePresetSelect" style="min-width:220px;">
                                <option value="">削除するプリセットを選択</option>
                            </select>
                            <button id="deletePresetBtn">削除</button>
                            <button id="downloadPresetBtn">プリセットをダウンロード</button>
                            <span id="presetMsg" class="small"></span>
                        </div>
                        <div class="small" style="margin-top:6px;">※ダウンロードしたJSONを presets/ に置き、?preset=名前 で配布できます</div>
                    </div>

                    <div id="presetIOSection">
                        <div class="hr"></div>
                        <div class="row">
                            <button id="exportPresetsBtn">保存プリセットを出力</button>
                            <button id="copyExportBtn">出力をコピー</button>
                        </div>
                        <div style="margin-top:8px;">
                            <textarea id="exportArea" placeholder="ここに出力されます（JSON）"></textarea>
                        </div>

                        <div class="row" style="margin-top:10px;">
                            <button id="importPresetsBtn">貼り付けJSONをインポート</button>
                        </div>
                        <div style="margin-top:8px;">
                            <textarea id="importArea" placeholder="ここに貼り付けてインポート（JSON）"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 出題設定 -->
            <div class="panel" id="setupPanel">
                <div class="row">
                    <label title="初心者向けの日本語化や補足を表示します">
                        <input type="checkbox" id="beginnerToggle" />
                        初心者モード（日本語化/補足）
                    </label>

                    <span id="setupCountsDiff">
                    <label>
                        問題数：
                        <select id="countSelect">
                            <option value="all">全件</option>
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="15">15</option>
                            <option value="20">20</option>
                        </select>
                    </label>

                    <span class="small">難易度：</span>
                    <label><input type="checkbox" class="diffChk" value="1" checked>★</label>
                    <label><input type="checkbox" class="diffChk" value="2" checked>★★</label>
                    <label><input type="checkbox" class="diffChk" value="3" checked>★★★</label>
                    </span>

                    <button id="startBtn">開始</button>
                </div>

                <div id="setupDetails">
                <div class="hr"></div>

                <div class="row">
                    <div id="langFilterWrap" style="min-width:220px;">
                        <label><input type="checkbox" id="langAll" checked> 言語：すべて</label>
                        <div id="langBox" class="checkgrid" style="margin-top:8px;"></div>
                    </div>

                    <div style="min-width:220px;">
                        <label><input type="checkbox" id="genreAll" checked> ジャンル：すべて</label>
                        <div id="genreBox" class="checkgrid" style="margin-top:8px;"></div>
                    </div>
                </div>
                </div>

                <div id="setupFooter">
                <div class="hr"></div>
                <div id="teacherLinkExample" class="small" style="display:none;"></div>
                </div>
            </div>

            <!-- 問題表示 -->
            <div class="panel">
                <div id="quiz">出題設定を選んで「開始」を押してください。</div>
                <div class="hr"></div>
                <div class="row">
                    <button id="nextBtn" style="display:none;">次の問題</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        (function () {
            var KEY = "glowadder-theme";
            var btnNight = document.getElementById("btnThemeNight");
            var btnClassroom = document.getElementById("btnThemeClassroom");

            function applyTheme(theme) {
                var next = theme === "classroom" ? "classroom" : "night";
                document.documentElement.setAttribute("data-theme", next);
                try { localStorage.setItem(KEY, next); } catch (e) { }
                btnNight.classList.toggle("active", next === "night");
                btnClassroom.classList.toggle("active", next === "classroom");
            }

            btnNight.addEventListener("click", function () { applyTheme("night"); });
            btnClassroom.addEventListener("click", function () { applyTheme("classroom"); });
            applyTheme(document.documentElement.getAttribute("data-theme"));
        })();
    </script>
    <script src="codeview.js"></script>
    <script src="quiz.js"></script>
</body>

</html>
